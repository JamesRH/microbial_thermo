[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microbial-thermo"
version = "0.1.0"
description = "Thermodynamic calculations and figures for microbial physiology and biogeochemistry"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "James R. Henriksen" }]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.5,<3.0",
    "scipy>=1.7,!=1.14.0",
    "pygcc==1.5.3",
    "chempy>=0.10",
    "sympy>=1.12",
    "pint>=0.24",
    "matplotlib>=3.8",
    "plotly>=6.0",
    "click>=8.1",
    "pyyaml>=6.0",
    # Only needed for balance_equation(choose="minimal"); see README.
    "pulp>=2.7",
]

[project.optional-dependencies]
figures = ["seaborn>=0.13", "rdkit>=2024.03"]
web = ["streamlit>=1.38"]
# nbclient executes the teaching notebooks in the test suite.
# pymatgen is TEST-ONLY: it cross-checks our mineral oxidation states against
# an independent (ICSD-statistics) method. Nothing at runtime imports it.
dev = ["ruff", "jupytext", "ipykernel", "ipywidgets", "nbclient>=0.9", "pymatgen"]

[project.scripts]
mthermo = "microbial_thermo.cli:main"

[tool.setuptools.packages.find]
include = ["microbial_thermo*"]

[tool.setuptools.package-data]
microbial_thermo = ["data/*.yaml", "data/external/*.csv", "data/external/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
