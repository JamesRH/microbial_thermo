# Curated microbial metabolisms.
#
# Each entry is a donor couple and an acceptor couple, both written
# (reduced, oxidized) as everywhere else in this library. Potentials and free
# energies are computed from the backend, not stored, so this file carries only
# chemistry and context.
#
# Doubles as the regression corpus: every entry is balanced and put through the
# two-path cross-check by the test suite.
#
# A side may name several species, which is what lets *incomplete* oxidations
# be catalogued: syntrophic propionate oxidation yields acetate and bicarbonate
# together, in a ratio conservation cannot supply. Write such a side as a list,
# optionally with explicit proportions:
#
#     donor: ["Propanoate(aq)", ["Acetate", "HCO3-"]]
#     donor: ["Butanoate(aq)", [["Acetate", 2]]]

metabolisms:
  # --- aerobic ---
  - name: aerobic_acetate_oxidation
    label: Aerobic acetate oxidation
    group: aerobic respiration
    donor: [acetate, "CO2(aq)"]
    acceptor: ["H2O", "O2(aq)"]
    key_element: C
    note: Complete heterotrophic oxidation; the reference high-yield metabolism.

  - name: knallgas
    label: Aerobic hydrogen oxidation (Knallgas)
    group: aerobic respiration
    donor: ["H2(g)", "H+"]
    acceptor: ["H2O", "O2(aq)"]
    organisms: Cupriavidus, Hydrogenovibrio

  - name: aerobic_methanotrophy
    label: Aerobic methanotrophy
    group: aerobic respiration
    donor: [methane, "CO2(aq)"]
    acceptor: ["H2O", "O2(aq)"]
    organisms: Methylococcus, Methylosinus

  - name: sulfide_oxidation_oxygen
    label: Sulfide oxidation with oxygen
    group: sulfur oxidation
    donor: ["HS-", "SO4-2"]
    acceptor: ["H2O", "O2(aq)"]
    organisms: Beggiatoa, Thiobacillus

  - name: sulfur_oxidation_oxygen
    label: Elemental sulfur oxidation with oxygen
    group: sulfur oxidation
    donor: ["Sulfur(s)", "SO4-2"]
    acceptor: ["H2O", "O2(aq)"]

  - name: ammonia_oxidation
    label: Ammonia oxidation (nitritation)
    group: nitrification
    donor: ["NH4+", "NO2-"]
    acceptor: ["H2O", "O2(aq)"]
    organisms: Nitrosomonas, Nitrosopumilus

  - name: nitrite_oxidation
    label: Nitrite oxidation (nitratation)
    group: nitrification
    donor: ["NO2-", "NO3-"]
    acceptor: ["H2O", "O2(aq)"]
    organisms: Nitrobacter, Nitrospira

  - name: comammox
    label: Complete ammonia oxidation (comammox)
    group: nitrification
    donor: ["NH4+", "NO3-"]
    acceptor: ["H2O", "O2(aq)"]
    organisms: Nitrospira inopinata

  - name: iron_oxidation_oxygen
    label: Iron(II) oxidation with oxygen
    group: metal oxidation
    donor: ["Fe+2", goethite]
    acceptor: ["H2O", "O2(aq)"]
    organisms: Gallionella, Mariprofundus

  - name: manganese_oxidation_oxygen
    label: Manganese(II) oxidation with oxygen
    group: metal oxidation
    donor: ["Mn+2", pyrolusite]
    acceptor: ["H2O", "O2(aq)"]

  # --- nitrogen ---
  - name: denitrification_acetate
    label: Denitrification with acetate
    group: denitrification
    donor: [acetate, "CO2(aq)"]
    acceptor: ["N2(aq)", "NO3-"]
    key_element: C

  - name: denitrification_hydrogen
    label: Denitrification with hydrogen
    group: denitrification
    donor: ["H2(g)", "H+"]
    acceptor: ["N2(aq)", "NO3-"]

  - name: denitrification_step_nitrate_nitrite
    label: "Denitrification step: nitrate to nitrite"
    group: denitrification
    donor: ["H2(g)", "H+"]
    acceptor: ["NO2-", "NO3-"]

  - name: dnra
    label: Dissimilatory nitrate reduction to ammonium (DNRA)
    group: nitrogen
    donor: ["H2(g)", "H+"]
    acceptor: ["NH4+", "NO3-"]

  - name: anammox
    label: Anaerobic ammonium oxidation (anammox)
    group: nitrogen
    donor: ["NH4+", "N2(aq)"]
    acceptor: ["N2(aq)", "NO2-"]
    organisms: Brocadia, Kuenenia

  - name: sulfide_oxidation_nitrate
    label: Sulfide oxidation with nitrate
    group: sulfur oxidation
    donor: ["HS-", "SO4-2"]
    acceptor: ["N2(aq)", "NO3-"]
    organisms: Thiobacillus denitrificans

  # --- metal reduction ---
  - name: ferrihydrite_reduction_acetate
    label: Ferrihydrite reduction with acetate
    group: metal reduction
    donor: [acetate, "CO2(aq)"]
    acceptor: ["Fe+2", ferrihydrite]
    key_element: C
    organisms: Geobacter, Shewanella

  - name: goethite_reduction_hydrogen
    label: Goethite reduction with hydrogen
    group: metal reduction
    donor: ["H2(g)", "H+"]
    acceptor: ["Fe+2", goethite]
    note: Crystalline Fe(III) is far less favourable than ferrihydrite.

  - name: manganese_reduction_acetate
    label: Manganese(IV) reduction with acetate
    group: metal reduction
    donor: [acetate, "CO2(aq)"]
    acceptor: ["Mn+2", pyrolusite]
    key_element: C

  # --- sulfate reduction ---
  - name: hydrogenotrophic_sulfate_reduction
    label: Hydrogenotrophic sulfate reduction
    group: sulfate reduction
    donor: ["H2(g)", "H+"]
    acceptor: ["HS-", "SO4-2"]
    organisms: Desulfovibrio, Archaeoglobus

  - name: acetotrophic_sulfate_reduction
    label: Acetotrophic sulfate reduction
    group: sulfate reduction
    donor: [acetate, "CO2(aq)"]
    acceptor: ["HS-", "SO4-2"]
    key_element: C
    organisms: Desulfobacter

  - name: lactate_sulfate_reduction
    label: Lactate oxidation with sulfate
    group: sulfate reduction
    donor: [lactate, "CO2(aq)"]
    acceptor: ["HS-", "SO4-2"]
    key_element: C

  - name: sulfur_reduction_hydrogen
    label: Elemental sulfur reduction with hydrogen
    group: sulfur reduction
    donor: ["H2(g)", "H+"]
    acceptor: ["HS-", "Sulfur(s)"]

  # --- methanogenesis and methane oxidation ---
  - name: hydrogenotrophic_methanogenesis
    label: Hydrogenotrophic methanogenesis
    group: methanogenesis
    donor: ["H2(g)", "H+"]
    acceptor: [methane, "CO2(aq)"]
    organisms: Methanobacterium, Methanocaldococcus

  - name: acetoclastic_methanogenesis
    label: Acetoclastic methanogenesis
    group: methanogenesis
    donor: [acetate, "CO2(aq)"]
    acceptor: [methane, "CO2(aq)"]
    key_element: C
    organisms: Methanosarcina, Methanosaeta

  - name: methylotrophic_methanogenesis
    label: Methylotrophic methanogenesis from methanol
    group: methanogenesis
    donor: [methanol, "CO2(aq)"]
    acceptor: [methane, "CO2(aq)"]
    key_element: C

  - name: anaerobic_methane_oxidation
    label: Anaerobic oxidation of methane with sulfate
    group: methane oxidation
    donor: [methane, "CO2(aq)"]
    acceptor: ["HS-", "SO4-2"]
    organisms: ANME archaea with sulfate-reducing partners
    note: Operates within a few kJ/mol of equilibrium in situ.

  # --- acetogenesis ---
  - name: acetogenesis
    label: Homoacetogenesis from H2 and CO2
    group: acetogenesis
    donor: ["H2(g)", "H+"]
    acceptor: [acetate, "CO2(aq)"]
    key_element: C
    organisms: Acetobacterium, Clostridium ljungdahlii

  # --- syntrophy ---
  #
  # These are endergonic under standard conditions and only proceed when a
  # partner keeps the hydrogen low -- which is the whole point of syntrophy,
  # and why they are worth having in a course.
  - name: syntrophic_propionate_oxidation
    label: Syntrophic propionate oxidation
    group: syntrophy
    donor: ["Propanoate(aq)", ["Acetate", "HCO3-"]]
    acceptor: ["H2(g)", "H+"]
    key_element: C
    organisms: Syntrophobacter
    note: >-
      Propionate + 3 H2O -> acetate + bicarbonate + H+ + 3 H2. Endergonic at
      standard state; requires a hydrogen scavenger.

  - name: syntrophic_butyrate_oxidation
    label: Syntrophic butyrate oxidation
    group: syntrophy
    donor: ["Butanoate(aq)", [["Acetate", 2]]]
    acceptor: ["H2(g)", "H+"]
    key_element: C
    organisms: Syntrophomonas
    note: >-
      Butyrate + 2 H2O -> 2 acetate + H+ + 2 H2. Endergonic at standard state.

  - name: syntrophic_ethanol_oxidation
    label: Syntrophic ethanol oxidation
    group: syntrophy
    donor: ["Ethanol(aq)", ["Acetate"]]
    acceptor: ["H2(g)", "H+"]
    key_element: C
    organisms: "Syntrophus, the classic S organism"

  # --- arsenic ---
  #
  # Arsenic is run in both directions: As(V) is respired as an electron
  # acceptor and As(III) is oxidised as a donor, sometimes in the same
  # sediment centimetres apart. The couple sits close to zero volts at pH 7,
  # which is why both directions can pay depending on what is on the other
  # side of the reaction.
  - name: arsenate_respiration_hydrogen
    label: Arsenate respiration with hydrogen
    group: arsenic reduction
    donor: ["H2(g)", "H+"]
    acceptor: ["As(III)", "As(V)"]
    key_element: As
    organisms: Sulfurospirillum barnesii, Desulfitobacterium
    note: Dissimilatory arsenate reduction (DARP), not the detoxifying ars operon.

  - name: arsenate_respiration_acetate
    label: Arsenate respiration with acetate
    group: arsenic reduction
    donor: [acetate, "CO2(aq)"]
    acceptor: ["As(III)", "As(V)"]
    key_element: C
    organisms: Chrysiogenes arsenatis, Desulfotomaculum auripigmentum

  - name: arsenate_respiration_lactate
    label: Arsenate respiration with lactate
    group: arsenic reduction
    donor: ["Lactate(aq)", ["Acetate", "CO2(aq)"]]
    acceptor: ["As(III)", "As(V)"]
    key_element: C
    organisms: Shewanella sp. ANA-3, Sulfurospirillum
    note: >
      Incomplete oxidation, stopping at acetate, as these organisms do. The
      third carbon leaves as CO2, which conservation cannot infer on its own --
      hence the two-species donor side.

  - name: arsenite_oxidation_oxygen
    label: Arsenite oxidation with oxygen
    group: arsenic oxidation
    donor: ["As(III)", "As(V)"]
    acceptor: ["H2O", "O2(aq)"]
    key_element: As
    organisms: Rhizobium sp. NT-26, Thiomonas

  - name: arsenite_oxidation_nitrate
    label: Arsenite oxidation with nitrate
    group: arsenic oxidation
    donor: ["As(III)", "As(V)"]
    acceptor: ["NO2-", "NO3-"]
    key_element: As
    organisms: Alkalilimnicola ehrlichii MLHE-1
    note: Anaerobic chemolithotrophic arsenite oxidation, found in Mono Lake.

  # --- carbon fixation ---
  #
  # The anabolic half of chemolithoautotrophy, kept separate from the catabolic
  # entries above because it is the one reaction here that does NOT pay. That
  # is the point of it: fixing CO2 costs energy, and an autotroph has to earn
  # that back from its catabolism. Pairing this entry against
  # arsenite_oxidation_oxygen is the cleanest way to show a whole organism's
  # budget in two lines.
  #
  # The biomass term is a placeholder -- <CH2O>, cell carbon at oxidation state
  # zero -- and it warns every time it is used. See supplemental_gibbs.yaml.
  - name: arsenite_carbon_fixation
    label: Carbon fixation driven by arsenite oxidation
    group: carbon fixation
    donor: ["As(III)", "As(V)"]
    acceptor: ["Biomass(aq)", "CO2(aq)"]
    key_element: C
    organisms: Rhizobium sp. NT-26, Alkalilimnicola ehrlichii MLHE-1
    note: >
      Endergonic by design: this is the cost side of the ledger, not a
      metabolism that runs on its own. Uses the unverified <CH2O> biomass
      placeholder.

  # --- metal and metalloid respiration ---
  #
  # Anaerobes that breathe things other than oxygen, sulfate or nitrate. Each
  # is a described metabolism with an isolated organism, and each is also an
  # environmental remediation route -- the reduced product is the insoluble
  # one, so the metabolism immobilises the contaminant.
  - name: selenate_respiration_hydrogen
    label: Selenate respiration with hydrogen
    group: metalloid reduction
    donor: ["H2(g)", "H+"]
    acceptor: ["SeO3--", "SeO4--"]
    key_element: Se
    organisms: Thauera selenatis, Sulfurospirillum barnesii
    note: Se(VI) to Se(IV); the first step of the selenium reduction chain.

  - name: selenate_respiration_acetate
    label: Selenate respiration with acetate
    group: metalloid reduction
    donor: [acetate, "CO2(aq)"]
    acceptor: ["SeO3--", "SeO4--"]
    key_element: C
    organisms: Thauera selenatis

  - name: selenite_reduction_hydrogen
    label: Selenite reduction to elemental selenium
    group: metalloid reduction
    donor: ["H2(g)", "H+"]
    acceptor: ["Se", "SeO3--"]
    key_element: Se
    note: >
      Se(IV) to Se(0). The product is insoluble red elemental selenium, which
      is why selenium-reducing organisms are used to strip selenium from
      irrigation drainage. Arsenic has no equivalent step -- As(III) stays
      dissolved, which is exactly why arsenic is the harder problem.

  - name: chromate_reduction_acetate
    label: Chromate reduction with acetate
    group: metal reduction
    donor: [acetate, "CO2(aq)"]
    acceptor: ["Cr+++", "CrO4--"]
    key_element: C
    organisms: Shewanella oneidensis, Desulfovibrio vulgaris
    note: Cr(VI) is soluble and carcinogenic; Cr(III) precipitates as hydroxide.

  - name: uranium_reduction_acetate
    label: Uranium(VI) reduction with acetate
    group: metal reduction
    donor: [acetate, "CO2(aq)"]
    acceptor: [Uraninite, "UO2++"]
    key_element: C
    organisms: Geobacter sulfurreducens, Desulfovibrio
    note: >
      The basis of acetate-amended uranium bioremediation at Rifle, Colorado:
      soluble uranyl is reduced to uraninite and drops out of the groundwater.

  # --- disproportionation ---
  #
  # The donor and the acceptor are the same element: part of it is oxidised
  # and part reduced, with no external partner. Sulfur does this at three
  # oxidation states and it is the reason a sulfur cycle can run without any
  # net input of oxidant.
  #
  # These are the entries where standard state is most misleading. Elemental
  # sulfur disproportionation is *endergonic* at unit activity -- notebook 07
  # draws the Frost diagram that says so -- and only pays once the sulfide is
  # drawn down, which in a real sediment means iron is precipitating it.
  - name: sulfur_disproportionation
    label: Elemental sulfur disproportionation
    group: disproportionation
    donor: ["Sulfur(s)", "SO4--"]
    acceptor: ["HS-", "Sulfur(s)"]
    key_element: S
    organisms: Desulfocapsa sulfoexigens, Desulfobulbus propionicus
    note: >-
      4 S + 4 H2O -> SO4-2 + 3 HS- + 5 H+. Endergonic at unit activity and
      exergonic below about 1.7e-2, so it needs a sulfide sink -- normally
      FeS precipitation. Inside the biological energy quantum until the
      sulfide falls near 1e-5.

  - name: sulfite_disproportionation
    label: Sulfite disproportionation
    group: disproportionation
    donor: ["SO3--", "SO4--"]
    acceptor: ["HS-", "SO3--"]
    key_element: S
    organisms: Desulfocapsa, Desulfovibrio sulfodismutans
    note: >-
      Much the easier of the two: sulfite sits well above the convex hull at
      every pH, so this pays about 39 kJ/mol e- where elemental sulfur pays
      nothing.

  - name: thiosulfate_disproportionation
    label: Thiosulfate disproportionation
    group: disproportionation
    donor: ["S2O3--", "SO4--"]
    acceptor: ["HS-", "S2O3--"]
    key_element: S
    organisms: Desulfocapsa, Desulfobulbus
    note: >-
      Thiosulfate's two sulfur atoms are already at different oxidation
      states, -I and +V, so this splits a molecule that is half way there.
      Marginal at standard state, which is why it also depends on a sulfide
      sink.

  # --- more iron and manganese ---
  - name: nitrate_dependent_iron_oxidation
    label: Nitrate-dependent iron(II) oxidation
    group: metal oxidation
    donor: ["Fe++", "Goethite"]
    acceptor: ["N2(aq)", "NO3-"]
    organisms: Acidovorax, Pseudogulbenkiania
    note: >-
      Anaerobic iron oxidation, and the reason ferric oxides form in sediment
      that never sees oxygen. Whether it is enzymatic or abiotic oxidation by
      denitrification intermediates is still argued.

  - name: manganese_reduction_hydrogen
    label: Manganese(IV) reduction with hydrogen
    group: metal reduction
    donor: ["H2(g)", "H+"]
    acceptor: ["Mn++", "Pyrolusite"]
    organisms: Shewanella, Geobacter
    note: >-
      The strongest acceptor a sediment normally has after oxygen and
      nitrate, which is why manganese reduction sits above iron reduction in
      the redox zonation.

  # --- more carbon and nitrogen ---
  - name: n_damo
    label: Nitrite-dependent anaerobic methane oxidation (n-damo)
    group: methane oxidation
    donor: [methane, "CO2(aq)"]
    acceptor: ["N2(aq)", "NO2-"]
    key_element: C
    organisms: Candidatus Methylomirabilis oxyfera
    note: >-
      Methane oxidised against nitrite rather than sulfate. At pH 7 it pays
      about -116 kJ/mol e- against AOM's -3.7 -- thirty times better, and the
      difference between a comfortable living and life at the thermodynamic
      edge. Methylomirabilis is thought to make its own oxygen by dismutating
      NO, which would make it the only known intra-aerobic anaerobe.

  - name: syntrophic_acetate_oxidation
    label: Syntrophic acetate oxidation
    group: syntrophy
    donor: [acetate, "HCO3-"]
    acceptor: ["H2(g)", "H+"]
    key_element: C
    organisms: Clostridium ultunense, Thermacetogenium phaeum
    note: >-
      Acetogenesis run backwards, and endergonic at standard state. It takes
      over from acetoclastic methanogenesis when ammonia or temperature
      inhibits the acetoclasts, with a hydrogenotrophic partner keeping the
      hydrogen low.

  # --- more metalloid reduction ---
  - name: selenite_reduction_acetate
    label: Selenite reduction with acetate
    group: metalloid reduction
    donor: [acetate, "CO2(aq)"]
    acceptor: ["Se", "SeO3--"]
    key_element: C
    organisms: Bacillus selenitireducens, Thauera selenatis
    note: >-
      The step that makes the red elemental selenium bioreactors are built
      to harvest. Arsenic has no equivalent, which is notebook 11's point.

  - name: chromate_reduction_hydrogen
    label: Chromate reduction with hydrogen
    group: metalloid reduction
    donor: ["H2(g)", "H+"]
    acceptor: ["Cr+++", "CrO4--"]
    organisms: Shewanella oneidensis, Desulfovibrio vulgaris
    note: >-
      Cr(VI) to Cr(III): soluble carcinogen to nearly insoluble hydroxide.
      Strongly pH dependent -- worth over a volt in acid and about 0.36 V at
      pH 7.

  # --- more phototrophic carbon fixation ---
  #
  # The cost side of the ledger for two more anoxygenic phototrophs, written
  # the same way as the arsenite entry: endergonic by design, with light
  # paying the difference. See notebooks photoFe and photoNO2.
  - name: iron_carbon_fixation
    label: Carbon fixation driven by iron(II) oxidation (photoferrotrophy)
    group: carbon fixation
    donor: ["Fe++", "Fe(OH)3"]
    acceptor: ["Biomass(aq)", "CO2(aq)"]
    key_element: C
    organisms: Rhodobacter ferrooxidans SW2, Chlorobium ferrooxidans
    note: >-
      Ferrihydrite rather than goethite is the product, which matters: against
      goethite the reaction comes out very slightly exergonic, and against the
      poorly-crystalline phase these organisms actually make it is about
      +26 kJ/mol e-. Uses the unverified <CH2O> biomass placeholder.

  - name: nitrite_carbon_fixation
    label: Carbon fixation driven by nitrite oxidation
    group: carbon fixation
    donor: ["NO2-", "NO3-"]
    acceptor: ["Biomass(aq)", "CO2(aq)"]
    key_element: C
    organisms: Thiocapsa, Rhodopseudomonas
    note: >-
      The most expensive of the three at about +78 kJ/mol e-, because nitrite
      is the weakest donor of them. Uses the unverified <CH2O> biomass
      placeholder.
