# Formation energies for species pyGCC does not carry.
#
# ================== READ THIS BEFORE TRUSTING A NUMBER ==================
# Every value here is a literature figure typed in by hand, NOT computed from
# an equation of state and NOT cross-checked against a second source the way
# the mineral data was. Entries marked `verified: false` emit a UserWarning
# whenever they are used, and any figure built on one is flagged.
#
# Verifying an entry means: find the primary source, confirm the value and its
# standard state (aqueous, 1 molal, 25 C, and on the convention that
# dGf(H+) = 0), record the citation in `provenance`, and set `verified: true`.
# Until then treat these as placeholders good to a few kJ/mol at best.
# ========================================================================
#
# These are single-temperature values with no heat-capacity data, so they are
# honoured at 25 C and refused elsewhere unless `delta_Hf_kJ_mol` is given, in
# which case a van 't Hoff correction is applied and a warning issued. That is
# the same stance taken for the isothermal manganese oxides: better to fail
# than to invent a temperature dependence the data does not contain.

species:
  - backend: "NH2OH(aq)"
    formula: "NH3O"
    display: "NH_2OH"
    phase: aq
    aliases: [hydroxylamine, "NH2OH", "NH2OH(aq)"]
    delta_Gf_kJ_mol: -23.5
    delta_Hf_kJ_mol: -98.9
    temperature_c: 25.0
    verified: false
    provenance: >-
      STILL UNVERIFIED. Commonly cited value for aqueous hydroxylamine, not
      traced to a primary source. Central nitrification intermediate.
      Searched and NOT found in: all fifteen databases bundled with pyGCC
      (speq21/23, supcrtbl, thermo.com, thermoddem, berman, data0, phreeqc,
      pitzer and the rest), and the OBIGT database of CHNOSZ, in both its
      inorganic_aq and organic_aq tables. The likely primary source is the NBS
      tables -- Wagman, D. D. et al. (1982), J. Phys. Chem. Ref. Data 11,
      Suppl. 2 -- which are not machine-readable from here; NIST has since
      published a digitised version that would settle it. CHECK BEFORE USE.

  - backend: "Glucose(aq)"
    formula: "C6H12O6"
    display: "glucose"
    phase: aq
    smiles: "OCC1OC(O)C(O)C(O)C1O"
    aliases: [glucose, dextrose, "C6H12O6"]
    delta_Gf_kJ_mol: -912.530
    delta_Hf_kJ_mol: -1261.894
    temperature_c: 25.0
    verified: true
    provenance: >-
      Amend, J. P. and Plyasunov, A. V. (2001), Geochimica et Cosmochimica
      Acta 65, 3901-3917 -- the HKF treatment of aqueous saccharides. Taken
      from the OBIGT database of CHNOSZ (Dick 2019), entry "glucose", as
      -218100 cal/mol, converted at 4.184 J/cal. OBIGT is SUPCRT-lineage, so
      the standard state matches the rest of this library: aqueous, 1 molal,
      25 C, dGf(H+) = 0. Replaces a previous hand-entered -917.2 of unknown
      origin, a 4.7 kJ/mol change. Read from OBIGT rather than from the paper
      itself; if you need the primary numbers, that is the citation.

  - backend: "Pyruvate(aq)"
    formula: "C3H3O3-"
    display: "pyruvate^-"
    phase: aq
    smiles: "CC(=O)C(=O)[O-]"
    aliases: [pyruvate]
    delta_Gf_kJ_mol: -475.302
    delta_Hf_kJ_mol: -574.882
    temperature_c: 25.0
    verified: true
    provenance: >-
      Canovas, P. A. III and Shock, E. L. (2016), Geochimica et Cosmochimica
      Acta 195, 293-322. Taken from the OBIGT database of CHNOSZ (Dick 2019),
      entry "pyruvate", as -113600 cal/mol, converted at 4.184 J/cal. OBIGT is
      SUPCRT-lineage, so the standard state matches the rest of this library.
      Replaces a hand-entered -474.5 of unknown origin, a 0.8 kJ/mol change --
      close enough that the old value was probably the same number rounded
      through a different route. Read from OBIGT rather than from the paper.

  - backend: "Biomass(aq)"
    formula: "CH2O"
    display: "\\langle CH_2O\\rangle"
    phase: aq
    aliases: [biomass, "CH2O", "<CH2O>", cells, "cell carbon"]
    delta_Gf_kJ_mol: -152.088
    temperature_c: 25.0
    verified: false
    provenance: >-
      A PLACEHOLDER, not a measured compound. Biomass has no formation energy
      in the sense the rest of this file does: <CH2O> is a stand-in for cell
      carbon at oxidation state zero, and the value here is this library's own
      aqueous glucose divided by six (-912.530 / 6 = -152.088), so the two are
      at least mutually consistent. Glucose is now traceable to Amend &
      Plyasunov (2001); this remains a placeholder regardless. It therefore inherits glucose's unverified
      status as well as its own.
      Two things it gets wrong on purpose. Real biomass is nearer CH1.8O0.5N0.2
      -- slightly more reduced than CH2O, so a little more costly to make --
      and it contains nitrogen, so this term omits the cost of assimilating N
      entirely. Treat any autotrophy yield built on it as an order-of-magnitude
      statement about sign and scale, not a number to quote.
      Vary delta_Gf and see whether your conclusion survives; if it does not,
      the conclusion was never about the chemistry.
