# Reference redox couples for the tower figure.
#
# Each entry is written reduced/oxidized, matching the Couple convention used
# throughout the library. Potentials are NOT stored here: they are computed
# from the backend at the requested pH and temperature, so the tower stays
# correct when those are changed rather than reproducing a table pinned to
# pH 7 and 25 C.
#
# key_element is given only where the automatic detection needs help.

couples:
  - {label: "CO2/acetate",      reduced: "acetate",     oxidized: "CO2(aq)", key_element: C, group: carbon}
  - {label: "2H+/H2",           reduced: "H2(g)",       oxidized: "H+",      group: hydrogen}
  - {label: "CO2/CH4",          reduced: "methane",     oxidized: "CO2(aq)", group: carbon}
  - {label: "S0/HS-",           reduced: "HS-",         oxidized: "Sulfur(s)", group: sulfur}
  - {label: "SO4-2/HS-",        reduced: "HS-",         oxidized: "SO4-2",   group: sulfur}
  - {label: "SO4-2/SO3-2",      reduced: "SO3-2",       oxidized: "SO4-2",   group: sulfur}
  # The sulfur intermediates. Thiosulfate reductase splits S2O3-2 into HS- and
  # SO3-2, hence the two-species side. Its -0.456 V is 54 mV below Thauer
  # (1977), who used an older thiosulfate formation energy.
  - {label: "SO4-2/S0",         reduced: "Sulfur(s)",   oxidized: "SO4-2",   group: sulfur}
  - {label: "SO3-2/HS-",        reduced: "HS-",         oxidized: "SO3-2",   group: sulfur}
  - {label: "S2O3-2/HS- + SO3-2", reduced: ["HS-", "SO3-2"], oxidized: "S2O3-2", key_element: S, group: sulfur}
  - {label: "S4O6-2/S2O3-2",    reduced: "S2O3-2",      oxidized: "S4O6-2",  key_element: S, group: sulfur}
  - {label: "Fe3+/Fe2+",        reduced: "Fe+2",        oxidized: "Fe+3",    group: metal}
  - {label: "NO3-/NO2-",        reduced: "NO2-",        oxidized: "NO3-",    group: nitrogen}
  - {label: "NO3-/NH4+",        reduced: "NH4+",        oxidized: "NO3-",    group: nitrogen}
  - {label: "NO2-/NH4+",        reduced: "NH4+",        oxidized: "NO2-",    group: nitrogen}
  - {label: "NO3-/N2",          reduced: "N2(aq)",      oxidized: "NO3-",    group: nitrogen}
  # The denitrification steps, nitrogen fixation, and the anammox and
  # nitrification intermediates. NO, N2O and N2 are the dissolved forms: with
  # NO(g), NO2-/NO would be 0.161 V higher. NH2OH is unverified and the tower
  # footnotes it.
  - {label: "NO2-/NO",          reduced: "NO(aq)",      oxidized: "NO2-",    group: nitrogen}
  - {label: "NO/N2O",           reduced: "N2O(aq)",     oxidized: "NO(aq)",  key_element: N, group: nitrogen}
  - {label: "N2O/N2",           reduced: "N2(aq)",      oxidized: "N2O(aq)", key_element: N, group: nitrogen}
  - {label: "N2/NH4+",          reduced: "NH4+",        oxidized: "N2(aq)",  key_element: N, group: nitrogen}
  - {label: "N2/N2H5+",         reduced: "N2H5+",       oxidized: "N2(aq)",  key_element: N, group: nitrogen}
  - {label: "NO2-/NH2OH",       reduced: "NH2OH(aq)",   oxidized: "NO2-",    group: nitrogen}
  - {label: "NH2OH/NH4+",       reduced: "NH4+",        oxidized: "NH2OH(aq)", group: nitrogen}
  - {label: "As(V)/As(III)",    reduced: "As(III)",     oxidized: "As(V)",   key_element: As, group: metalloid}
  - {label: "SeO4-2/SeO3-2",    reduced: "SeO3--",      oxidized: "SeO4--",  key_element: Se, group: metalloid}
  - {label: "SeO3-2/Se0",       reduced: "Se",          oxidized: "SeO3--",  key_element: Se, group: metalloid}
  - {label: "CrO4-2/Cr3+",      reduced: "Cr+++",       oxidized: "CrO4--",  key_element: Cr, group: metal}
  - {label: "UO2+2/UO2(s)",     reduced: "Uraninite",   oxidized: "UO2++",   key_element: U,  group: metal}
  - {label: "O2/H2O",           reduced: "H2O",         oxidized: "O2(g)",   group: oxygen}
  # Above O2/H2O, so unstable in water; it persists because it reacts slowly.
  # Below pH 7.6 (the pKa these data imply) HClO dominates; HClO/Cl- is
  # 17 mV weaker at pH 7.
  - {label: "ClO-/Cl-",         reduced: "Cl-",         oxidized: "ClO-",    group: chlorine}
