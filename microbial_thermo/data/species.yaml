# Species registry: maps pyGCC's legacy SUPCRT/GWB database names onto real
# chemical formulas, display strings, and friendly aliases.
#
# This layer exists because pyGCC species names are not parseable formulas
# ("Methane(aq)", "Acetate", "Lactate(aq)") and because the database uses
# doubled-sign charge notation ("SO4--") that differs from the "SO4-2" form
# most users type.
#
# Fields:
#   backend  - exact species string pyGCC expects (the lookup key)
#   formula  - parseable chemical formula, used for balancing and oxidation states
#   display  - LaTeX-ish label for figures
#   aliases  - anything a user might reasonably type
#   phase    - aq | g | s | l
#   smiles   - optional, enables per-atom oxidation states
#   canonical- declares this entry the intended answer for a name another
#              phase also claims. A bare "H2", "O2", "N2", "CO2" or "CH4"
#              resolves to the DISSOLVED form, since that is the one a cell
#              actually sees. Write "H2(g)" for the gas, or
#              resolve("H2", phase="g").

species:
  # --- solvent and proton ---
  - {backend: "H2O",  formula: "H2O", display: "H_2O", phase: l, aliases: [water, "H2O(l)"]}
  - {backend: "H+",   formula: "H+",  display: "H^+",  phase: aq, aliases: [proton, hydrogen ion]}
  - {backend: "OH-",  formula: "OH-", display: "OH^-", phase: aq, aliases: [hydroxide]}

  # --- oxygen and hydrogen ---
  - {backend: "O2(aq)", formula: "O2", display: "O_2(aq)", phase: aq, canonical: true, aliases: [O2, oxygen, dioxygen]}
  - {backend: "O2(g)",  formula: "O2", display: "O_2(g)",  phase: g,  aliases: ["O2(g)"]}
  - {backend: "H2(aq)", formula: "H2", display: "H_2(aq)", phase: aq, canonical: true, aliases: ["H2(aq)", dihydrogen]}
  - {backend: "H2(g)",  formula: "H2", display: "H_2(g)",  phase: g,  aliases: [H2, hydrogen, "H2(g)"]}

  # --- sulfur ---
  - {backend: "SO4--",    formula: "SO4-2",   display: "SO_4^{2-}",   phase: aq, aliases: [sulfate, "SO4-2", "SO42-"]}
  - {backend: "SO3--",    formula: "SO3-2",   display: "SO_3^{2-}",   phase: aq, aliases: [sulfite, "SO3-2"]}
  - {backend: "S2O3--",   formula: "S2O3-2",  display: "S_2O_3^{2-}", phase: aq, aliases: [thiosulfate, "S2O3-2"]}
  - {backend: "HS-",      formula: "HS-",     display: "HS^-",        phase: aq, aliases: [bisulfide, hydrosulfide]}
  - {backend: "H2S(aq)",  formula: "H2S",     display: "H_2S(aq)",    phase: aq, aliases: [H2S, "hydrogen sulfide"]}
  - {backend: "S--",      formula: "S-2",     display: "S^{2-}",      phase: aq, aliases: [sulfide ion, "S-2"]}
  - {backend: "Sulfur(s)", formula: "S",      display: "S^0",         phase: s,  aliases: [sulfur, "S(0)", S8, "elemental sulfur"]}

  # --- nitrogen ---
  - {backend: "NO3-",    formula: "NO3-",  display: "NO_3^-",  phase: aq, aliases: [nitrate]}
  - {backend: "NO2-",    formula: "NO2-",  display: "NO_2^-",  phase: aq, aliases: [nitrite]}
  - {backend: "N2(aq)",  formula: "N2",    display: "N_2(aq)", phase: aq, canonical: true, aliases: [N2, dinitrogen, "nitrogen gas"]}
  - {backend: "N2(g)",   formula: "N2",    display: "N_2(g)",  phase: g,  aliases: ["N2(g)"]}
  - {backend: "NH4+",    formula: "NH4+",  display: "NH_4^+",  phase: aq, aliases: [ammonium]}
  - {backend: "NH3(aq)", formula: "NH3",   display: "NH_3(aq)", phase: aq, aliases: [NH3, ammonia]}

  # --- carbon, inorganic ---
  - {backend: "CO2(aq)",     formula: "CO2",  display: "CO_2(aq)", phase: aq, canonical: true, aliases: [CO2, "carbon dioxide"]}
  - {backend: "CO2(g)",      formula: "CO2",  display: "CO_2(g)",  phase: g,  aliases: ["CO2(g)"]}
  - {backend: "HCO3-",       formula: "HCO3-", display: "HCO_3^-", phase: aq, aliases: [bicarbonate]}
  - {backend: "CO3--",       formula: "CO3-2", display: "CO_3^{2-}", phase: aq, aliases: [carbonate, "CO3-2"]}
  - {backend: "Methane(aq)", formula: "CH4",  display: "CH_4(aq)", phase: aq, canonical: true, aliases: [CH4, methane, "CH4(aq)"]}
  - {backend: "CH4(g)",      formula: "CH4",  display: "CH_4(g)",  phase: g,  aliases: ["CH4(g)"]}

  # --- carbon, organic ---
  - {backend: "Acetate",         formula: "C2H3O2-", display: "CH_3COO^-",  phase: aq, smiles: "CC(=O)[O-]", aliases: [acetate, "CH3COO-", "C2H3O2-"]}
  - {backend: "Acetic_acid(aq)", formula: "C2H4O2",  display: "CH_3COOH",   phase: aq, smiles: "CC(=O)O",    aliases: ["acetic acid", "CH3COOH"]}
  - {backend: "Formate(aq)",     formula: "CHO2-",   display: "HCOO^-",     phase: aq, smiles: "[O-]C=O",    aliases: [formate, "HCOO-", "CHO2-"]}
  - {backend: "Formic_acid(aq)", formula: "CH2O2",   display: "HCOOH",      phase: aq, smiles: "OC=O",       aliases: ["formic acid", HCOOH]}
  - {backend: "Lactate(aq)",     formula: "C3H5O3-", display: "lactate^-",  phase: aq, smiles: "CC(O)C(=O)[O-]", aliases: [lactate]}
  - {backend: "Lactic_acid(aq)", formula: "C3H6O3",  display: "lactic\\ acid", phase: aq, smiles: "CC(O)C(=O)O", aliases: ["lactic acid"]}
  - {backend: "Propanoate(aq)",  formula: "C3H5O2-", display: "propionate^-", phase: aq, smiles: "CCC(=O)[O-]", aliases: [propionate, propanoate]}
  - {backend: "Butanoate(aq)",   formula: "C4H7O2-", display: "butyrate^-", phase: aq, smiles: "CCCC(=O)[O-]", aliases: [butyrate, butanoate]}
  - {backend: "Methanol(aq)",    formula: "CH4O",    display: "CH_3OH",     phase: aq, smiles: "CO",         aliases: [methanol, "CH3OH"]}
  - {backend: "Ethanol(aq)",     formula: "C2H6O",   display: "C_2H_5OH",   phase: aq, smiles: "CCO",        aliases: [ethanol, "C2H5OH"]}

  # --- iron and manganese ---
  #
  # Aqueous Fe and Mn come from the HKF database. The solid phases come from
  # the GWB database by way of their log K values; see backends/gwb.py.
  # Minerals marked "25 C only" below are tabulated at a single temperature
  # and will refuse to evaluate elsewhere rather than extrapolate.
  - {backend: "Fe++",   formula: "Fe+2", display: "Fe^{2+}", phase: aq, aliases: ["Fe+2", "Fe(II)", ferrous]}
  - {backend: "Fe+++",  formula: "Fe+3", display: "Fe^{3+}", phase: aq, aliases: ["Fe+3", "Fe(III)", ferric]}
  - {backend: "FeOH+",  formula: "FeOH+",  display: "FeOH^+",   phase: aq, aliases: ["FeOH+"]}
  - {backend: "FeOH++", formula: "FeOH+2", display: "FeOH^{2+}", phase: aq, aliases: ["FeOH+2"]}
  - {backend: "Mn++",   formula: "Mn+2", display: "Mn^{2+}", phase: aq, aliases: ["Mn+2", "Mn(II)"]}
  - {backend: "Mn+++",  formula: "Mn+3", display: "Mn^{3+}", phase: aq, aliases: ["Mn+3", "Mn(III)"]}
  - {backend: "MnO4-",  formula: "MnO4-",  display: "MnO_4^-",    phase: aq, aliases: [permanganate]}
  - {backend: "MnO4--", formula: "MnO4-2", display: "MnO_4^{2-}", phase: aq, aliases: [manganate, "MnO4-2"]}

  # Iron minerals
  - {backend: "Goethite",      formula: "FeOOH",   display: "FeOOH", phase: s, aliases: [goethite]}
  - {backend: "Hematite",      formula: "Fe2O3",   display: "Fe_2O_3", phase: s, aliases: [hematite]}
  - {backend: "Magnetite",     formula: "Fe3O4",   display: "Fe_3O_4", phase: s, aliases: [magnetite]}
  - {backend: "Siderite",      formula: "FeCO3",   display: "FeCO_3",  phase: s, aliases: [siderite]}
  - {backend: "Pyrite",        formula: "FeS2",    display: "FeS_2",   phase: s, aliases: [pyrite]}
  - {backend: "Fe(OH)3",       formula: "FeH3O3",  display: "Fe(OH)_3", phase: s, aliases: ["Fe(OH)3", ferrihydrite, "HFO"]}

  # Manganese minerals
  - {backend: "Pyrolusite",    formula: "MnO2",     display: "MnO_2",   phase: s, aliases: [pyrolusite, MnO2, "Mn(IV)"]}
  - {backend: "Manganite",     formula: "MnOOH",    display: "MnOOH",   phase: s, aliases: [manganite]}
  - {backend: "Hausmannite",   formula: "Mn3O4",    display: "Mn_3O_4", phase: s, aliases: [hausmannite]}
  - {backend: "Bixbyite",      formula: "Mn2O3",    display: "Mn_2O_3", phase: s, aliases: [bixbyite]}
  - {backend: "Birnessite",    formula: "Mn8H10O19", display: "Mn_8O_{14}\\cdot 5H_2O", phase: s, aliases: [birnessite]}
  - {backend: "Rhodochrosite", formula: "MnCO3",    display: "MnCO_3",  phase: s, aliases: [rhodochrosite]}

  # --- conjugate acids and bases needed by the speciation layer ---
  # These complete the acid-base families in acid_base.yaml. Without both
  # members present, a family cannot be used.
  - {backend: "H3PO4(aq)", formula: "H3PO4",  display: "H_3PO_4",     phase: aq, aliases: ["phosphoric acid"]}
  - {backend: "H2PO4-",    formula: "H2PO4-", display: "H_2PO_4^-",   phase: aq, aliases: ["H2PO4-", "dihydrogen phosphate"]}
  - {backend: "HPO4--",    formula: "HPO4-2", display: "HPO_4^{2-}",  phase: aq, aliases: ["HPO4-2", "hydrogen phosphate"]}
  - {backend: "PO4---",    formula: "PO4-3",  display: "PO_4^{3-}",   phase: aq, aliases: ["PO4-3", orthophosphate]}
  - {backend: "HSO3-",     formula: "HSO3-",  display: "HSO_3^-",     phase: aq, aliases: [bisulfite]}
  - {backend: "HSO4-",     formula: "HSO4-",  display: "HSO_4^-",     phase: aq, aliases: [bisulfate]}
  - {backend: "HNO2(aq)",  formula: "HNO2",   display: "HNO_2",       phase: aq, aliases: ["nitrous acid"]}
  - {backend: "Propanoic_acid(aq)", formula: "C3H6O2", display: "propionic\\ acid", phase: aq, smiles: "CCC(=O)O",  aliases: ["propionic acid", "propanoic acid"]}
  - {backend: "Butanoic_acid(aq)",  formula: "C4H8O2", display: "butyric\\ acid",   phase: aq, smiles: "CCCC(=O)O", aliases: ["butyric acid", "butanoic acid"]}

  # --- vanadium ---
  #
  # All of these come from pyGCC, not the supplemental table: the aqueous ions
  # from speq21.dat and the oxides and the sulfate ion pair from thermo.com.dat
  # by the log K route.
  #
  # Two naming traps worth knowing. Vanadium dioxide is "V2O4" in the database,
  # the doubled formula of VO2 -- the same V(IV) compound. And "VO2+" is NOT
  # that: it is the aqueous dioxovanadium(V) cation, a different oxidation
  # state. A bare "VO2" resolves to the solid, since that is what the name
  # conventionally means.
  - {backend: "V++",       formula: "V+2",   display: "V^{2+}",     phase: aq, aliases: ["V+2", "V(II)"]}
  - {backend: "V+++",      formula: "V+3",   display: "V^{3+}",     phase: aq, aliases: ["V+3", "V(III)"]}
  - {backend: "VO++",      formula: "VO+2",  display: "VO^{2+}",    phase: aq, aliases: ["VO+2", vanadyl, "V(IV)"]}
  - {backend: "VO2+",      formula: "VO2+",  display: "VO_2^+",     phase: aq, aliases: [dioxovanadium, "V(V)"]}
  - {backend: "VO4---",    formula: "VO4-3", display: "VO_4^{3-}",  phase: aq, aliases: ["VO4-3", vanadate, orthovanadate]}
  - {backend: "V2O4",      formula: "V2O4",  display: "VO_2",       phase: s,  aliases: ["VO2", "vanadium dioxide", "vanadium(IV) oxide"]}
  - {backend: "V3O5",      formula: "V3O5",  display: "V_3O_5",     phase: s,  aliases: ["V3O5"]}
  - {backend: "VOSO4(aq)", formula: "VOSO4", display: "VOSO_4(aq)", phase: aq, aliases: ["VOSO4", "vanadyl sulfate", "vanadyl sulphate"]}

  # --- arsenic ---
  #
  # The two states that matter biologically. Arsenate is a respiratory electron
  # acceptor and arsenite an electron donor, so the As(V)/As(III) step is run in
  # both directions by different organisms -- which is unusual enough to be
  # worth a place on the tower.
  #
  # The arsenate ladder is HKF data from speq21.dat. As(III) has two parallel
  # representations in SUPCRT-lineage data, differing by one water:
  # As(OH)3 / H2AsO3- (arsenous acid) and HAsO2 / AsO2- (metarsenous acid).
  # Both are registered. They agree to 0.21 kJ/mol over 0-100 C and their pKa
  # to 0.03 -- and since As(OH)3(aq) reaches the backend by the GWB log K route
  # while HAsO2(aq) is direct HKF, that agreement is a real cross-check of two
  # independent data paths rather than a tautology. Asserted in
  # tests/test_arsenic.py.
  #
  # A bare "As(III)" is As(OH)3(aq) and "As(V)" is HAsO4--, which is how the
  # couple is written in the arsenic microbiology literature. At pH 7 arsenate
  # is really a mixture -- pKa2 is 6.76, so H2AsO4- and HAsO4-- are both
  # present in quantity -- so use the arsenate family for anything where that
  # matters.
  - {backend: "As(OH)3(aq)", formula: "AsH3O3",  display: "As(OH)_3",    phase: aq, aliases: ["As(III)", arsenite, "H3AsO3", "As(OH)3", "arsenous acid"]}
  - {backend: "H2AsO3-",     formula: "H2AsO3-", display: "H_2AsO_3^-",  phase: aq, aliases: ["H2AsO3-", "dihydrogen arsenite"]}
  - {backend: "HAsO2(aq)",   formula: "HAsO2",   display: "HAsO_2(aq)",  phase: aq, aliases: ["HAsO2", "metarsenous acid"]}
  - {backend: "AsO2-",       formula: "AsO2-",   display: "AsO_2^-",     phase: aq, aliases: ["AsO2-", metaarsenite]}
  - {backend: "H3AsO4(aq)",  formula: "H3AsO4",  display: "H_3AsO_4",    phase: aq, aliases: ["H3AsO4", "arsenic acid"]}
  - {backend: "H2AsO4-",     formula: "H2AsO4-", display: "H_2AsO_4^-",  phase: aq, aliases: ["H2AsO4-", "dihydrogen arsenate"]}
  - {backend: "HAsO4--",     formula: "HAsO4-2", display: "HAsO_4^{2-}", phase: aq, aliases: ["HAsO4-2", "As(V)", arsenate, "hydrogen arsenate"]}
  - {backend: "AsO4---",     formula: "AsO4-3",  display: "AsO_4^{3-}",  phase: aq, aliases: ["AsO4-3", orthoarsenate]}

  # --- minerals, wider set ---
  #
  # Phases a sediment or a rock-hosted system actually contains, so a reaction
  # can be written against the solid that is really there rather than against
  # a dissolved proxy. Sources vary -- HKF where speq23 has the phase, the GWB
  # log K route otherwise, supcrtbl for scorodite -- and `reaction.provenance()`
  # will say which for any given result.
  #
  # Hydrates are written out rather than with the database's colon notation:
  # gypsum is CaSO4H4O2, not "CaSO4:2H2O", because the colon is not a formula.
  #
  # Two deliberate omissions, both because the data is not good enough:
  #
  #   Wustite is Fe(0.947)O -- genuinely non-stoichiometric, and a fractional
  #   subscript is not something this library's formula parser should learn to
  #   accept just for one phase.
  #
  #   Arsenopyrite (FeAsS) is the one that matters and it is left out on
  #   purpose. Three routes give three answers -- GWB -50.0, supcrtbl's two
  #   polymorphs -109.6 and -125.5 kJ/mol -- and the GWB figure rests on a
  #   single finite log K point. Until that is resolved against a primary
  #   source, exposing any of them would be picking one at random. See the
  #   Future work item.

  # Iron sulfides. Both are tabulated as "FeS", so a bare formula is ambiguous
  # and has to be declared. Troilite wins it: troilite IS stoichiometric FeS,
  # while pyrrhotite is properly Fe(1-x)S and is only written FeS by the
  # database's convention. Ask for pyrrhotite by name.
  - {backend: "Troilite",    formula: "FeS",            display: "FeS",                   phase: s, canonical: true, aliases: [troilite]}
  - {backend: "Pyrrhotite",  formula: "FeS",            display: "FeS",                   phase: s, aliases: [pyrrhotite]}

  # Carbonates -- the carbonate system's solid end
  # Calcite and aragonite are the same formula, so the bare one is declared:
  # calcite is the polymorph stable at Earth-surface conditions, aragonite the
  # metastable one. They differ by under a kJ/mol, which is exactly why leaving
  # the choice to file ordering would be hard to notice.
  - {backend: "Calcite",     formula: "CaCO3",          display: "CaCO_3",                phase: s, canonical: true, aliases: [calcite]}
  - {backend: "Aragonite",   formula: "CaCO3",          display: "CaCO_3",                phase: s, aliases: [aragonite]}
  - {backend: "Dolomite",    formula: "CaMg(CO3)2",     display: "CaMg(CO_3)_2",          phase: s, aliases: [dolomite]}
  - {backend: "Magnesite",   formula: "MgCO3",          display: "MgCO_3",                phase: s, aliases: [magnesite]}

  # Sulfates
  - {backend: "Gypsum",      formula: "CaSO4H4O2",      display: "CaSO_4\\cdot 2H_2O",    phase: s, aliases: [gypsum]}
  - {backend: "Anhydrite",   formula: "CaSO4",          display: "CaSO_4",                phase: s, aliases: [anhydrite]}
  - {backend: "Barite",      formula: "BaSO4",          display: "BaSO_4",                phase: s, aliases: [barite, barytes]}
  - {backend: "Jarosite",    formula: "KFe3(SO4)2(OH)6", display: "KFe_3(SO_4)_2(OH)_6",  phase: s, aliases: [jarosite]}

  # Arsenic minerals
  - {backend: "Scorodite",   formula: "FeAsH4O6",       display: "FeAsO_4\\cdot 2H_2O",   phase: s, aliases: [scorodite, "ferric arsenate"]}
  - {backend: "Orpiment",    formula: "As2S3",          display: "As_2S_3",               phase: s, aliases: [orpiment]}
  - {backend: "Claudetite",  formula: "As2O3",          display: "As_2O_3",               phase: s, aliases: [claudetite, "arsenic trioxide"]}

  # Other metal sulfides -- the sinks trace metals end up in
  - {backend: "Sphalerite",  formula: "ZnS",            display: "ZnS",                   phase: s, aliases: [sphalerite]}
  - {backend: "Galena",      formula: "PbS",            display: "PbS",                   phase: s, aliases: [galena]}
  - {backend: "Chalcopyrite", formula: "CuFeS2",        display: "CuFeS_2",               phase: s, aliases: [chalcopyrite]}
  - {backend: "Covellite",   formula: "CuS",            display: "CuS",                   phase: s, aliases: [covellite]}
  - {backend: "Millerite",   formula: "NiS",            display: "NiS",                   phase: s, aliases: [millerite]}
  - {backend: "Cinnabar",    formula: "HgS",            display: "HgS",                   phase: s, aliases: [cinnabar]}

  # Phosphate
  - {backend: "Hydroxyapatite", formula: "Ca5(OH)(PO4)3", display: "Ca_5(OH)(PO_4)_3",    phase: s, aliases: [hydroxyapatite, apatite]}
  - {backend: "Vivianite",   formula: "Fe3(PO4)2H16O8", display: "Fe_3(PO_4)_2\\cdot 8H_2O", phase: s, aliases: [vivianite]}

  # --- elemental forms ---
  #
  # Needed for Frost and Latimer diagrams, where the element is the origin by
  # definition. That they come out within 0.004 kJ/mol of zero through the GWB
  # log K route is a free check on that route.
  #
  # Manganese is the exception and the reason this block is worth reading:
  # elemental Mn evaluates to -2.5 kJ/mol, not zero. That is a database
  # problem, not a rounding one, so a manganese Frost diagram drawn against
  # this species inherits a 2.5 kJ/mol offset. Sulfur and carbon are omitted
  # because Sulfur(s) and Graphite already cover them.
  - {backend: "As",  formula: "As", display: "As(s)",  phase: s, aliases: ["As(s)", "arsenic metal", "elemental arsenic"]}
  - {backend: "Se",  formula: "Se", display: "Se(s)",  phase: s, aliases: ["Se(s)", "selenium", "elemental selenium"]}
  - {backend: "Fe",  formula: "Fe", display: "Fe(s)",  phase: s, aliases: ["Fe(s)", "iron metal", "zero-valent iron", ZVI]}
  - {backend: "Mn",  formula: "Mn", display: "Mn(s)",  phase: s, aliases: ["Mn(s)", "manganese metal"]}
  - {backend: "Cu",  formula: "Cu", display: "Cu(s)",  phase: s, aliases: ["Cu(s)", "copper metal"]}
  - {backend: "Zn",  formula: "Zn", display: "Zn(s)",  phase: s, aliases: ["Zn(s)", "zinc metal"]}
  - {backend: "Ni",  formula: "Ni", display: "Ni(s)",  phase: s, aliases: ["Ni(s)", "nickel metal"]}

  # --- selenium ---
  #
  # Selenate and selenite respiration are real anaerobic metabolisms, and the
  # Se(VI)/Se(IV)/Se(0) ladder is the textbook case of a metalloid reduced to
  # an insoluble element -- the same trick arsenic does not do.
  - {backend: "SeO4--",     formula: "SeO4-2",  display: "SeO_4^{2-}",   phase: aq, aliases: ["SeO4-2", selenate, "Se(VI)"]}
  - {backend: "HSeO4-",     formula: "HSeO4-",  display: "HSeO_4^-",     phase: aq, aliases: ["HSeO4-", "hydrogen selenate"]}
  - {backend: "SeO3--",     formula: "SeO3-2",  display: "SeO_3^{2-}",   phase: aq, aliases: ["SeO3-2", selenite, "Se(IV)"]}
  - {backend: "HSeO3-",     formula: "HSeO3-",  display: "HSeO_3^-",     phase: aq, aliases: ["HSeO3-", "hydrogen selenite"]}

  # --- chromium ---
  - {backend: "CrO4--",     formula: "CrO4-2",  display: "CrO_4^{2-}",   phase: aq, aliases: ["CrO4-2", chromate, "Cr(VI)"]}
  - {backend: "HCrO4-",     formula: "HCrO4-",  display: "HCrO_4^-",     phase: aq, aliases: ["HCrO4-", "hydrogen chromate"]}
  - {backend: "Cr+++",      formula: "Cr+3",    display: "Cr^{3+}",      phase: aq, aliases: ["Cr+3", "Cr(III)", chromium]}
  - {backend: "Cr++",       formula: "Cr+2",    display: "Cr^{2+}",      phase: aq, aliases: ["Cr+2", "Cr(II)"]}

  # --- molybdenum, tungsten, uranium ---
  - {backend: "MoO4--",     formula: "MoO4-2",  display: "MoO_4^{2-}",   phase: aq, aliases: ["MoO4-2", molybdate]}
  - {backend: "WO4--",      formula: "WO4-2",   display: "WO_4^{2-}",    phase: aq, aliases: ["WO4-2", tungstate]}
  - {backend: "UO2++",      formula: "UO2+2",   display: "UO_2^{2+}",    phase: aq, aliases: ["UO2+2", uranyl, "U(VI)"]}
  - {backend: "U++++",      formula: "U+4",     display: "U^{4+}",       phase: aq, aliases: ["U+4", "U(IV)"]}
  - {backend: "Uraninite",  formula: "UO2",     display: "UO_2",         phase: s,  aliases: [uraninite, pitchblende]}

  # --- aqueous metal ions, the counterparts of the sulfides above ---
  #
  # A metal sulfide is unusable without them: writing sphalerite against
  # sulfate needs somewhere for the zinc to go, and this library will not
  # invent it.
  - {backend: "Zn++",  formula: "Zn+2", display: "Zn^{2+}", phase: aq, aliases: ["Zn+2", "Zn(II)", zinc]}
  - {backend: "Cu++",  formula: "Cu+2", display: "Cu^{2+}", phase: aq, aliases: ["Cu+2", "Cu(II)", cupric]}
  - {backend: "Cu+",   formula: "Cu+",  display: "Cu^+",    phase: aq, aliases: ["Cu(I)", cuprous]}
  - {backend: "Ni++",  formula: "Ni+2", display: "Ni^{2+}", phase: aq, aliases: ["Ni+2", "Ni(II)", nickel]}
  - {backend: "Co++",  formula: "Co+2", display: "Co^{2+}", phase: aq, aliases: ["Co+2", "Co(II)", cobalt]}
  - {backend: "Co+++", formula: "Co+3", display: "Co^{3+}", phase: aq, aliases: ["Co+3", "Co(III)"]}
  - {backend: "Cd++",  formula: "Cd+2", display: "Cd^{2+}", phase: aq, aliases: ["Cd+2", cadmium]}
  - {backend: "Pb++",  formula: "Pb+2", display: "Pb^{2+}", phase: aq, aliases: ["Pb+2", lead]}
  - {backend: "Hg++",  formula: "Hg+2", display: "Hg^{2+}", phase: aq, aliases: ["Hg+2", mercury, mercuric]}
  - {backend: "Ag+",   formula: "Ag+",  display: "Ag^+",    phase: aq, aliases: [silver]}

  # --- major ions, needed by the carbonates and sulfates ---
  - {backend: "Ca++", formula: "Ca+2", display: "Ca^{2+}", phase: aq, aliases: ["Ca+2", calcium]}
  - {backend: "Mg++", formula: "Mg+2", display: "Mg^{2+}", phase: aq, aliases: ["Mg+2", magnesium]}
  - {backend: "Ba++", formula: "Ba+2", display: "Ba^{2+}", phase: aq, aliases: ["Ba+2", barium]}
  - {backend: "K+",   formula: "K+",   display: "K^+",     phase: aq, aliases: [potassium]}
  - {backend: "Na+",  formula: "Na+",  display: "Na^+",    phase: aq, aliases: [sodium]}
  - {backend: "Cl-",  formula: "Cl-",  display: "Cl^-",    phase: aq, aliases: [chloride]}
